services:
  db:
    image: postgres:15-alpine
    container_name: focuspad_db
    environment:
      POSTGRES_DB: focuspad
      POSTGRES_USER: focuspad_user
      POSTGRES_PASSWORD: focuspad_password
      POSTGRES_HOST_AUTH_METHOD: trust
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - focuspad_network
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U focuspad_user -d focuspad"]
      interval: 10s
      timeout: 5s
      retries: 5

  web:
    build: .
    container_name: focuspad_web
    ports:
      - "5000:5000"
    environment:
      - FLASK_ENV=docker
      - DATABASE_URL=postgresql://focuspad_user:focuspad_password@db:5432/focuspad
      - SECRET_KEY=your-super-secret-key-change-in-production
      - JWT_SECRET_KEY=your-jwt-secret-key-change-in-production
      - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID}
      - GOOGLE_CLIENT_SECRET=${GOOGLE_CLIENT_SECRET}
      - CORS_ORIGINS=http://localhost:3000,http://localhost:8080
    env_file:
      - .env
    depends_on:
      db:
        condition: service_healthy
    networks:
      - focuspad_network
    restart: unless-stopped
    volumes:
      - .:/app

  # Optional: PgAdmin for database management
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: focuspad_pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@focuspad.com
      PGADMIN_DEFAULT_PASSWORD: admin
      PGADMIN_CONFIG_SERVER_MODE: 'False'
    ports:
      - "8080:80"
    depends_on:
      - db
    networks:
      - focuspad_network
    restart: unless-stopped
    profiles:
      - admin

volumes:
  postgres_data:
    driver: local

networks:
  focuspad_network:
    driver: bridge 