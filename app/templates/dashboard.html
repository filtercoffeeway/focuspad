    <!-- Main Container -->
    <div class="main-container">
        <!-- Sidebar -->
        <div class="sidebar" id="sidebar">
            <div class="sidebar-header">
                <div class="sidebar-title">Notes</div>
                <button class="new-note-btn" onclick="createNewNote()">+ New</button>
            </div>
            <div class="notes-list" id="notesList">
                <div class="loading">
                    <div class="spinner"></div>
                    Loading notes...
                </div>
            </div>
        </div>

        <!-- Main Content -->
        <div class="main-content">
            <div class="note-display" id="noteDisplay">
                <div class="empty-state">
                    <div class="empty-icon">📝</div>
                    <h3>Welcome to FocusPad</h3>
                    <p>Select a note from the sidebar or create a new one to get started.</p>
                </div>
            </div>

            <!-- Input Area -->
            <div class="input-area">
                <textarea 
                    class="text-input" 
                    id="textInput" 
                    placeholder="Add content to your note..."
                    rows="3"
                ></textarea>
                <button class="save-btn" id="saveBtn" onclick="saveContent()">Save</button>
            </div>
        </div>
    </div>

    <script>
        let currentNote = null;
        let notes = [];
        const accessToken = "{{ access_token }}";

        // Function to handle token expiration and redirect to login
        function handleTokenExpiration(response) {
            if (response.status === 401) {
                // Check if the error message indicates token expiration
                response.json().then(data => {
                    if (data.msg && data.msg.includes('expired')) {
                        console.log('Token has expired, redirecting to login...');
                        alert('Your session has expired. Please log in again.');
                        window.location.href = '/';
                    }
                }).catch(() => {
                    // If we can't parse the response, just redirect anyway for 401
                    console.log('401 error detected, redirecting to login...');
                    alert('Your session has expired. Please log in again.');
                    window.location.href = '/';
                });
                return true; // Token expired
            }
            return false; // Token still valid
        }

        // Initialize the application
        document.addEventListener('DOMContentLoaded', function() {
            console.log('Dashboard initialized');
            
            // Initialize theme
            initializeTheme();
            
            loadNotes();
            
            // Auto-resize textarea
            const textInput = document.getElementById('textInput');
            textInput.addEventListener('input', function() {
                this.style.height = 'auto';
                this.style.height = Math.min(this.scrollHeight, 150) + 'px';
                
                // Enable save button if there's content and a current note
                const saveBtn = document.getElementById('saveBtn');
                const hasContent = this.value.trim().length > 0;
                const hasNote = currentNote !== null;
                
                saveBtn.disabled = !hasContent || !hasNote;
                
                // Update placeholder based on state
                if (!hasNote) {
                    this.placeholder = "Select a note from the sidebar to start adding content...";
                } else {
                    this.placeholder = "Add content to your note...";
                }
            });

            // Save on Enter + Ctrl/Cmd
            textInput.addEventListener('keydown', function(e) {
                if ((e.ctrlKey || e.metaKey) && e.key === 'Enter' && !document.getElementById('saveBtn').disabled) {
                    e.preventDefault();
                    saveContent();
                }
            });

            // Test the textarea immediately
            console.log('Textarea element:', textInput);
            console.log('Textarea disabled:', textInput.disabled);
        });

        // Theme management functions
        function initializeTheme() {
            const savedTheme = localStorage.getItem('focuspad-theme') || 'light';
            setTheme(savedTheme);
        }

        function toggleTheme() {
            const currentTheme = document.documentElement.getAttribute('data-theme') || 'light';
            const newTheme = currentTheme === 'light' ? 'dark' : 'light';
            setTheme(newTheme);
        }

        function setTheme(theme) {
            document.documentElement.setAttribute('data-theme', theme);
            localStorage.setItem('focuspad-theme', theme);
            
            const toggleButton = document.getElementById('themeToggle');
            if (theme === 'dark') {
                toggleButton.innerHTML = '☀️ Light';
            } else {
                toggleButton.innerHTML = '🌙 Dark';
            }
        }

        // Load notes from API
        async function loadNotes() {
            console.log('Loading notes...');
            try {
                const response = await fetch('/api/notes/', {
                    headers: {
                        'Authorization': `Bearer ${accessToken}`
                    }
                });
                
                console.log('Notes response status:', response.status);
                
                if (handleTokenExpiration(response)) return;
                
                if (response.ok) {
                    const data = await response.json();
                    notes = data.notes || [];
                    console.log('Loaded notes:', notes.length);
                    renderNotesList();
                } else {
                    console.error('Failed to load notes, status:', response.status);
                    const errorText = await response.text();
                    console.error('Error response:', errorText);
                    document.getElementById('notesList').innerHTML = '<div style="padding: 20px; color: #999;">Failed to load notes. Try refreshing the page.</div>';
                }
            } catch (error) {
                console.error('Error loading notes:', error);
                document.getElementById('notesList').innerHTML = '<div style="padding: 20px; color: #999;">Error loading notes. Check your connection.</div>';
            }
        }

        // Render notes list in sidebar
        function renderNotesList() {
            const notesList = document.getElementById('notesList');
            
            if (notes.length === 0) {
                notesList.innerHTML = '<div style="padding: 20px; color: #999; text-align: center;">No notes yet.<br>Create your first note!</div>';
                return;
            }

            // Sort by updated_at (most recent first)
            const sortedNotes = [...notes].sort((a, b) => new Date(b.updated_at) - new Date(a.updated_at));

            notesList.innerHTML = sortedNotes.map(note => `
                <div class="note-item" onclick="selectNote(${note.id})" data-note-id="${note.id}">
                    <div class="note-header-row">
                        <div class="note-title">${escapeHtml(note.title || 'Untitled Note')}</div>
                        <div class="note-actions">
                            <button class="delete-btn" onclick="deleteNote(${note.id}, event)" title="Delete note">🗑️</button>
                        </div>
                    </div>
                    <div class="note-preview">${escapeHtml(getPreviewText(note))}</div>
                    <div class="note-date">${formatDate(note.updated_at)}</div>
                </div>
            `).join('');
        }

        // Escape HTML to prevent XSS
        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        // Get preview text from note content
        function getPreviewText(note) {
            // First check if we have a preview field from the API (for notes list)
            if (note.preview) {
                return note.preview;
            }
            
            // First try raw_content as it's the most direct representation
            if (note.raw_content && note.raw_content.trim()) {
                return note.raw_content.substring(0, 100) + (note.raw_content.length > 100 ? '...' : '');
            }
            
            // Handle the new content structure (object with categories)
            if (note.content && typeof note.content === 'object') {
                // Try to find any text content in any category
                for (const [category, categoryData] of Object.entries(note.content)) {
                    let items = categoryData;
                    
                    // Handle the API structure: {category_info: {...}, items: [...]}
                    if (categoryData && typeof categoryData === 'object' && categoryData.items) {
                        items = categoryData.items;
                    }
                    
                    if (Array.isArray(items) && items.length > 0) {
                        // Find first non-empty item
                        for (const item of items) {
                            let text = '';
                            if (typeof item === 'string' && item.trim()) {
                                text = item;
                            } else if (item && typeof item === 'object') {
                                text = item.text || item.content || '';
                            }
                            
                            if (text && text.trim()) {
                                return text.substring(0, 100) + (text.length > 100 ? '...' : '');
                            }
                        }
                    } else if (typeof items === 'object' && items !== null) {
                        // Handle object with nested content
                        for (const [key, value] of Object.entries(items)) {
                            if (typeof value === 'string' && value.trim()) {
                                return value.substring(0, 100) + (value.length > 100 ? '...' : '');
                            }
                        }
                    } else if (typeof items === 'string' && items.trim()) {
                        return items.substring(0, 100) + (items.length > 100 ? '...' : '');
                    }
                }
            }
            
            return 'No content yet...';
        }

        // Format date for display (converts UTC to local time)
        function formatDate(dateString) {
            const date = new Date(dateString); // Automatically converts UTC to local time
            
            const months = ['JAN', 'FEB', 'MAR', 'APR', 'MAY', 'JUN', 
                           'JUL', 'AUG', 'SEP', 'OCT', 'NOV', 'DEC'];
            const month = months[date.getMonth()];
            const day = String(date.getDate()).padStart(2, '0');
            const year = date.getFullYear();
            
            return `${month}-${day}-${year}`;
        }

        // Select a note
        async function selectNote(noteId) {
            console.log('Selecting note with ID:', noteId);
            
            if (!noteId || noteId === 'undefined') {
                console.error('Invalid note ID:', noteId);
                alert('Invalid note ID. Please try refreshing the page.');
                return;
            }
            
            try {
                // Update UI first
                document.querySelectorAll('.note-item').forEach(item => {
                    item.classList.remove('active');
                });
                const selectedItem = document.querySelector(`[data-note-id="${noteId}"]`);
                if (selectedItem) {
                    selectedItem.classList.add('active');
                } else {
                    console.warn('Could not find note item in DOM for ID:', noteId);
                }

                // Load note details
                console.log('Fetching note details for ID:', noteId);
                const response = await fetch(`/api/notes/${noteId}`, {
                    headers: {
                        'Authorization': `Bearer ${accessToken}`
                    }
                });

                console.log('Note detail response status:', response.status);

                if (handleTokenExpiration(response)) return;

                if (response.ok) {
                    const responseData = await response.json();
                    console.log('Received note data:', responseData);
                    
                    // Extract note from the response wrapper
                    const noteData = responseData.note || responseData;
                    
                    // Validate the note data
                    if (!noteData || !noteData.id) {
                        console.error('Invalid note data received:', responseData);
                        alert('Received invalid note data. Please try again.');
                        return;
                    }
                    
                    currentNote = noteData;
                    console.log('Current note set to:', currentNote);
                    console.log('Current note ID:', currentNote.id);
                    
                    renderNoteDisplay();
                    
                    // Update text input state
                    const textInput = document.getElementById('textInput');
                    textInput.placeholder = 'Add content to your note...';
                    
                    // Update save button state
                    const saveBtn = document.getElementById('saveBtn');
                    saveBtn.disabled = !textInput.value.trim();
                    
                    console.log('Note selected successfully, ID:', currentNote.id);
                } else {
                    const errorText = await response.text();
                    console.error('Failed to load note. Status:', response.status, 'Error:', errorText);
                    alert('Failed to load note. Please try again.');
                }
            } catch (error) {
                console.error('Error loading note:', error);
                alert('Error loading note. Please check your connection.');
            }
        }

        // Render note in main display area
        function renderNoteDisplay() {
            const noteDisplay = document.getElementById('noteDisplay');
            
            if (!currentNote) {
                noteDisplay.innerHTML = `
                    <div class="empty-state">
                        <div class="empty-icon">📝</div>
                        <h3>Welcome to FocusPad</h3>
                        <p>Select a note from the sidebar or create a new one to get started.</p>
                    </div>
                `;
                return;
            }

            // The content is already organized by category, no need to group it
            const categorizedContent = currentNote.content || {};
            
            // Format the created date for display (converts UTC to local time)
            const formatNoteDate = (dateString) => {
                if (!dateString) return 'Not specified';
                const date = new Date(dateString); // Automatically converts UTC to local time
                
                const months = ['JAN', 'FEB', 'MAR', 'APR', 'MAY', 'JUN', 
                               'JUL', 'AUG', 'SEP', 'OCT', 'NOV', 'DEC'];
                const month = months[date.getMonth()];
                const day = String(date.getDate()).padStart(2, '0');
                const year = date.getFullYear();
                
                return `${month}-${day}-${year}`;
            };
            
            noteDisplay.innerHTML = `
                <div class="note-header">
                    <h1 class="note-title-display editable-title" 
                        contenteditable="true" 
                        data-field="title"
                        data-original="${escapeHtml(currentNote.title || '')}"
                        onblur="saveField(this, 'title')"
                        onkeydown="handleEnterKey(event)">
                        ${escapeHtml(currentNote.title || 'Untitled Note')}
                    </h1>
                    <p class="note-meta">${formatRelativeDate(currentNote.updated_at)}</p>
                </div>

                <div class="note-details">
                    <div class="note-detail-item">
                        <label class="detail-label">📅 Date:</label>
                        <span class="detail-value clickable" onclick="openDatePicker()" style="display: flex; align-items: center; gap: 8px;">
                            ${formatNoteDate(currentNote.created_at)}
                            <span style="color: var(--text-muted); font-size: 0.75rem;">📅 Click to change</span>
                        </span>
                    </div>
                    <div class="note-detail-item">
                        <label class="detail-label">👥 Attendees:</label>
                        <span class="detail-value editable" 
                              contenteditable="true"
                              data-field="attendees"
                              data-original="${escapeHtml(currentNote.attendees || '')}"
                              onblur="saveField(this, 'attendees')"
                              onkeydown="handleEnterKey(event)">
                            ${currentNote.attendees ? escapeHtml(currentNote.attendees) : 'None specified'}
                        </span>
                    </div>
                </div>

                ${currentNote.raw_content ? `
                <div class="content-section">
                    ${formatRawContentAsParagraphs(currentNote.raw_content)}
                </div>
                ` : ''}

                <div class="categories-grid">
                    ${renderCategorizedContent(categorizedContent)}
                </div>
            `;
        }

        // Format raw content as proper paragraphs
        function formatRawContentAsParagraphs(rawContent) {
            if (!rawContent || !rawContent.trim()) {
                return '<p><em>No content yet.</em></p>';
            }

            // Split by newlines, trim each line, and filter out empty lines
            const lines = rawContent
                .split(/\n/)
                .map(line => line.trim())
                .filter(line => line.length > 0);

            if (lines.length === 0) {
                return '<p><em>No content yet.</em></p>';
            }

            // Add periods to lines that don't end with punctuation, then join into one paragraph
            const formattedLines = lines.map(line => {
                // Check if line already ends with punctuation
                const endsWithPunctuation = /[.!?:;,]$/.test(line);
                return endsWithPunctuation ? line : line + '.';
            });

            // Join all lines with spaces to create one flowing paragraph
            const paragraph = formattedLines.join(' ');

            return `<p>${escapeHtml(paragraph)}</p>`;
        }

        // Format date relative to now (like "2 hours ago")
        function formatRelativeDate(dateString) {
            const date = new Date(dateString);
            const now = new Date();
            const diff = now - date;
            const minutes = Math.floor(diff / 60000);
            const hours = Math.floor(diff / 3600000);
            const days = Math.floor(diff / 86400000);

            if (minutes < 1) return 'Just now';
            if (minutes < 60) return `${minutes} minute${minutes === 1 ? '' : 's'} ago`;
            if (hours < 24) return `${hours} hour${hours === 1 ? '' : 's'} ago`;
            if (days < 7) return `${days} day${days === 1 ? '' : 's'} ago`;
            if (days < 30) return `${Math.floor(days / 7)} week${Math.floor(days / 7) === 1 ? '' : 's'} ago`;
            return date.toLocaleDateString();
        }

        // Define preferred order without Summary
        const categoryOrder = ['Key Points', 'Action Items', 'Ideas', 'References'];
        
        // Render categorized content using list-based design
        function renderCategorizedContent(categorizedContent) {
            if (!categorizedContent || Object.keys(categorizedContent).length === 0) {
                return `
                    <div class="category-item">
                        <div class="empty-category">
                            <p>No content yet. Start adding some content below!</p>
                        </div>
                    </div>
                `;
            }

            // Sort categories by preferred order, then alphabetically
            const sortedEntries = Object.entries(categorizedContent).sort(([categoryA], [categoryB]) => {
                const indexA = categoryOrder.indexOf(categoryA);
                const indexB = categoryOrder.indexOf(categoryB);
                
                if (indexA !== -1 && indexB !== -1) return indexA - indexB;
                if (indexA !== -1 && indexB === -1) return -1;
                if (indexA === -1 && indexB !== -1) return 1;
                return categoryA.localeCompare(categoryB);
            });

            return sortedEntries.map(([category, categoryData]) => {
                let items = categoryData;
                
                // Handle API structure
                if (categoryData && typeof categoryData === 'object' && categoryData.items) {
                    items = categoryData.items;
                }

                // Ensure items is an array
                if (!Array.isArray(items)) {
                    items = [];
                }

                const itemCount = items.length;
                const categoryIcon = getCategoryIcon(category);
                
                // Auto-expand categories that have content
                const expandedClass = itemCount > 0 ? ' expanded' : '';

                return `
                    <div class="category-item${expandedClass}" id="category-${category.replace(/\s+/g, '-').toLowerCase()}">
                        <div class="category-header" onclick="toggleCategory('${category}')">
                            <div class="category-left">
                                <div class="category-icon">${categoryIcon}</div>
                                <div class="category-info">
                                    <div class="category-name">${escapeHtml(category)}</div>
                                    <div class="category-count">${itemCount} item${itemCount === 1 ? '' : 's'}</div>
                                </div>
                            </div>
                            <div class="category-actions" onclick="event.stopPropagation()">
                                <button class="add-btn" onclick="openAddItemModal('${category}')" title="Add item">+ Add</button>
                                <button class="edit-btn" onclick="openEditCategoryModal('${category}')" title="Edit category">✏️ Edit</button>
                            </div>
                        </div>
                        <div class="category-content">
                            ${renderCategoryItems(items, category)}
                        </div>
                    </div>
                `;
            }).join('');
        }

        // Render items within a category
        function renderCategoryItems(items, category) {
            if (!items || items.length === 0) {
                return `
                    <div class="empty-category">
                        <p>No items in ${category} yet.</p>
                    </div>
                `;
            }

            const itemsHtml = items.map((item, index) => {
                let text = '';
                if (typeof item === 'string') {
                    text = item;
                } else if (item && typeof item === 'object') {
                    text = item.text || item.content || JSON.stringify(item);
                }

                return `
                    <div class="category-list-item">
                        <span class="item-bullet">•</span>
                        <span class="item-text">${escapeHtml(text)}</span>
                        <div class="item-actions">
                            <button class="edit-item-btn" onclick="openEditItemModal('${category}', ${index})" title="Edit">✏️</button>
                            <button class="delete-item-btn" onclick="deleteItem('${category}', ${index})" title="Delete">🗑️</button>
                        </div>
                    </div>
                `;
            }).join('');

            return `<div class="category-list">${itemsHtml}</div>`;
        }

        // Toggle category expansion
        function toggleCategory(category) {
            const categoryElement = document.getElementById(`category-${category.replace(/\s+/g, '-').toLowerCase()}`);
            if (categoryElement) {
                categoryElement.classList.toggle('expanded');
            }
        }

        // Modal functions
        function openAddItemModal(category) {
            showModal('Add Item', `Add new item to ${category}`, '', (content) => {
                addItemToCategory(category, content);
            });
        }

        function openEditItemModal(category, itemIndex) {
            const categoryData = currentNote.content[category];
            const items = Array.isArray(categoryData) ? categoryData : (categoryData?.items || []);
            const item = items[itemIndex];
            const text = typeof item === 'string' ? item : (item?.text || item?.content || '');

            showModal('Edit Item', `Edit item in ${category}`, text, (content) => {
                editItemInCategory(category, itemIndex, content);
            });
        }

        function openEditCategoryModal(category) {
            const categoryData = currentNote.content[category];
            const items = Array.isArray(categoryData) ? categoryData : (categoryData?.items || []);
            const text = items.map(item => 
                typeof item === 'string' ? item : (item?.text || item?.content || '')
            ).join('\n');

            showModal('Edit Category', `Edit all items in ${category}`, text, (content) => {
                updateCategory(category, content);
            }, true);
        }

        // Generic modal function
        function showModal(title, subtitle, initialContent, onSave, isTextarea = false) {
            const modalHtml = `
                <div class="modal-overlay" id="editModal" onclick="closeModal(event)">
                    <div class="modal" onclick="event.stopPropagation()">
                        <div class="modal-header">
                            <div class="modal-title">
                                ${title}
                                <div style="font-size: 0.75rem; font-weight: normal; color: var(--text-muted);">${subtitle}</div>
                            </div>
                            <button class="close-btn" onclick="closeModal()">&times;</button>
                        </div>
                        <div class="modal-body">
                            <div class="form-group">
                                <label class="form-label">Content</label>
                                ${isTextarea ? 
                                    `<textarea class="form-textarea" id="modalContent" placeholder="Enter content (one item per line)">${escapeHtml(initialContent)}</textarea>` :
                                    `<input type="text" class="form-input" id="modalContent" placeholder="Enter content" value="${escapeHtml(initialContent)}">`
                                }
                            </div>
                        </div>
                        <div class="modal-footer">
                            <button class="btn-cancel" onclick="closeModal()">Cancel</button>
                            <button class="btn-save" onclick="saveModalContent()">Save</button>
                        </div>
                    </div>
                </div>
            `;

            document.body.insertAdjacentHTML('beforeend', modalHtml);
            
            // Store the save callback
            window.currentModalSave = onSave;
            
            // Show modal with animation
            requestAnimationFrame(() => {
                document.getElementById('editModal').classList.add('show');
                document.getElementById('modalContent').focus();
            });
        }

        function closeModal(event) {
            if (event && event.target !== event.currentTarget) return;
            
            const modal = document.getElementById('editModal');
            if (modal) {
                modal.classList.remove('show');
                setTimeout(() => {
                    modal.remove();
                    window.currentModalSave = null;
                }, 300);
            }
        }

        function saveModalContent() {
            const content = document.getElementById('modalContent').value.trim();
            if (content && window.currentModalSave) {
                window.currentModalSave(content);
            }
            closeModal();
        }

        // Category manipulation functions
        async function addItemToCategory(category, content) {
            if (!content.trim()) return;

            const updatedContent = { ...currentNote.content };
            if (!updatedContent[category]) {
                updatedContent[category] = { items: [] };
            }
            
            const items = updatedContent[category].items || [];
            items.push(content.trim());
            updatedContent[category].items = items;

            await updateNoteContent(updatedContent);
        }

        async function editItemInCategory(category, itemIndex, newContent) {
            if (!newContent.trim()) return;

            const updatedContent = { ...currentNote.content };
            const items = updatedContent[category]?.items || [];
            
            if (itemIndex >= 0 && itemIndex < items.length) {
                items[itemIndex] = newContent.trim();
                await updateNoteContent(updatedContent);
            }
        }

        async function deleteItem(category, itemIndex) {
            if (!confirm('Are you sure you want to delete this item?')) return;

            const updatedContent = { ...currentNote.content };
            const items = updatedContent[category]?.items || [];
            
            if (itemIndex >= 0 && itemIndex < items.length) {
                items.splice(itemIndex, 1);
                await updateNoteContent(updatedContent);
            }
        }

        async function updateCategory(category, content) {
            const updatedContent = { ...currentNote.content };
            
            const items = content.split('\n')
                .map(line => line.trim())
                .filter(line => line.length > 0);

            if (!updatedContent[category]) {
                updatedContent[category] = { items: [] };
            }
            
            updatedContent[category].items = items;
            await updateNoteContent(updatedContent);
        }

        // Update note content via API
        async function updateNoteContent(updatedContent) {
            try {
                const response = await fetch(`/api/notes/${currentNote.id}`, {
                    method: 'PUT',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${accessToken}`
                    },
                    body: JSON.stringify({
                        content: JSON.stringify(updatedContent)
                    })
                });

                if (handleTokenExpiration(response)) return;

                if (response.ok) {
                    currentNote.content = updatedContent;
                    renderNoteDisplay();
                    loadNotes(); // Refresh sidebar
                } else {
                    console.error('Failed to update note content');
                    alert('Failed to save changes. Please try again.');
                }
            } catch (error) {
                console.error('Error updating note content:', error);
                alert('Error saving changes. Please check your connection.');
            }
        }

        // Create new note
        async function createNewNote() {
            const title = 'New note';
            const attendees = ''; // Blank attendees

            console.log('Creating new note with title:', title);

            try {
                const requestBody = { title: title };
                // Don't add attendees if it's empty
                
                const response = await fetch('/api/notes/', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${accessToken}`
                    },
                    body: JSON.stringify(requestBody)
                });

                console.log('Create note response status:', response.status);

                if (handleTokenExpiration(response)) return;

                if (response.ok) {
                    const responseData = await response.json();
                    console.log('Created note response:', responseData);
                    
                    // Extract note from the response (could be wrapped in 'note' property)
                    const newNote = responseData.note || responseData;
                    
                    if (!newNote || !newNote.id) {
                        console.error('Invalid note data in create response:', responseData);
                        alert('Created note but received invalid data. Please refresh the page.');
                        return;
                    }
                    
                    notes.unshift(newNote); // Add to beginning
                    renderNotesList();
                    selectNote(newNote.id);
                } else {
                    const errorText = await response.text();
                    console.error('Failed to create note:', errorText);
                    alert('Failed to create note. Please try again.');
                }
            } catch (error) {
                console.error('Error creating note:', error);
                alert('Error creating note. Please check your connection.');
            }
        }

        // Delete note function
        async function deleteNote(noteId, event) {
            // Prevent the click event from bubbling up to selectNote
            event.stopPropagation();
            
            console.log('Deleting note with ID:', noteId);
            
            if (!noteId || noteId === 'undefined') {
                console.error('Invalid note ID:', noteId);
                alert('Invalid note ID. Please try refreshing the page.');
                return;
            }
            
            // Find the note to get its title for confirmation
            const noteToDelete = notes.find(note => note.id === noteId);
            const noteTitle = noteToDelete ? noteToDelete.title : 'this note';
            
            // Confirm deletion
            if (!confirm(`Are you sure you want to delete "${noteTitle}"? This action cannot be undone.`)) {
                return;
            }
            
            try {
                const response = await fetch(`/api/notes/${noteId}`, {
                    method: 'DELETE',
                    headers: {
                        'Authorization': `Bearer ${accessToken}`
                    }
                });
                
                console.log('Delete note response status:', response.status);
                
                if (handleTokenExpiration(response)) return;
                
                if (response.ok) {
                    // Remove note from local array
                    const noteIndex = notes.findIndex(note => note.id === noteId);
                    if (noteIndex !== -1) {
                        notes.splice(noteIndex, 1);
                    }
                    
                    // If this was the currently selected note, clear the display
                    if (currentNote && currentNote.id === noteId) {
                        currentNote = null;
                        const noteDisplay = document.getElementById('noteDisplay');
                        noteDisplay.innerHTML = `
                            <div class="empty-state">
                                <div class="empty-icon">📝</div>
                                <h3>Welcome to FocusPad</h3>
                                <p>Select a note from the sidebar or create a new one to get started.</p>
                            </div>
                        `;
                        
                        // Reset text input
                        const textInput = document.getElementById('textInput');
                        textInput.value = '';
                        textInput.placeholder = 'Select a note from the sidebar to start adding content...';
                        document.getElementById('saveBtn').disabled = true;
                    }
                    
                    // Update the notes list display
                    renderNotesList();
                    
                    console.log('Note deleted successfully');
                } else {
                    const errorText = await response.text();
                    console.error('Failed to delete note. Status:', response.status, 'Error:', errorText);
                    
                    let errorMessage = 'Failed to delete note.';
                    try {
                        const errorJson = JSON.parse(errorText);
                        if (errorJson.error) {
                            errorMessage += ' ' + errorJson.error;
                        }
                    } catch (e) {
                        // Error text is not JSON
                        errorMessage += ' ' + errorText;
                    }
                    
                    alert(errorMessage);
                }
            } catch (error) {
                console.error('Network error deleting note:', error);
                alert('Network error deleting note. Please check your connection.');
            }
        }

        // Save content to current note
        async function saveContent() {
            const textInput = document.getElementById('textInput');
            const content = textInput.value.trim();
            
            console.log('=== SAVE CONTENT DEBUG ===');
            console.log('Content to save:', content);
            console.log('Current note object:', currentNote);
            console.log('Current note ID:', currentNote ? currentNote.id : 'No current note');
            console.log('Access token available:', !!accessToken);
            
            // Validate inputs
            if (!content) {
                alert('Please enter some content to save.');
                return;
            }
            
            if (!currentNote) {
                alert('Please select a note first.');
                console.error('No current note selected');
                return;
            }
            
            if (!currentNote.id) {
                alert('Invalid note selected. Please try selecting the note again.');
                console.error('Current note has no ID:', currentNote);
                return;
            }

            const saveBtn = document.getElementById('saveBtn');
            const originalText = saveBtn.textContent;
            saveBtn.disabled = true;
            saveBtn.textContent = 'Saving...';

            try {
                const url = `/api/notes/${currentNote.id}/content`;
                console.log('Making request to:', url);
                
                const response = await fetch(url, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${accessToken}`
                    },
                    body: JSON.stringify({ text: content })
                });

                console.log('Save content response status:', response.status);
                console.log('Save content response headers:', Object.fromEntries(response.headers.entries()));

                if (handleTokenExpiration(response)) return;

                if (response.ok) {
                    const responseData = await response.json();
                    console.log('Save response data:', responseData);
                    
                    // Clear input
                    textInput.value = '';
                    textInput.style.height = 'auto';
                    
                    // Reload note to show updated content
                    console.log('Reloading note to show updated content...');
                    await selectNote(currentNote.id);
                    
                    // Update notes list
                    console.log('Updating notes list...');
                    await loadNotes();
                    
                    saveBtn.textContent = 'Saved!';
                    setTimeout(() => {
                        saveBtn.textContent = originalText;
                        saveBtn.disabled = true; // Disable until new content is entered
                    }, 2000);
                    
                    console.log('Content saved successfully');
                } else {
                    const errorText = await response.text();
                    console.error('Failed to save content. Status:', response.status);
                    console.error('Error response body:', errorText);
                    
                    let errorMessage = 'Failed to save content.';
                    try {
                        const errorJson = JSON.parse(errorText);
                        if (errorJson.error) {
                            errorMessage += ' ' + errorJson.error;
                        }
                    } catch (e) {
                        // Error text is not JSON
                        errorMessage += ' ' + errorText;
                    }
                    
                    alert(errorMessage);
                    saveBtn.textContent = originalText;
                    saveBtn.disabled = false;
                }
            } catch (error) {
                console.error('Network error saving content:', error);
                alert('Network error saving content. Please check your connection.');
                saveBtn.textContent = originalText;
                saveBtn.disabled = false;
            }
        }

        // Logout function
        function logout() {
            if (confirm('Are you sure you want to logout?')) {
                window.location.href = '/api/auth/logout/web';
            }
        }

        // Test function - you can call this from browser console
        window.testTextInput = function() {
            const textInput = document.getElementById('textInput');
            console.log('Text input element:', textInput);
            console.log('Disabled:', textInput.disabled);
            console.log('Value:', textInput.value);
            console.log('Placeholder:', textInput.placeholder);
            textInput.focus();
        };

        // Handle special keydown events for categories
        function handleEnterKey(event) {
            if (event.key === 'Enter' && !event.shiftKey) {
                event.preventDefault();
                event.target.blur();
            }
        }

        // Generic function to save any field (title, attendees, date)
        async function saveField(element, fieldType) {
            const newValue = element.textContent ? element.textContent.trim() : element.value;
            const originalValue = element.getAttribute('data-original');
            
            // Handle placeholder text for attendees
            if (fieldType === 'attendees' && newValue === 'None specified') {
                return;
            }
            
            // If no change, don't save
            if (newValue === originalValue || (newValue === 'None specified' && originalValue === '')) {
                return;
            }

            // Show saving indicator
            const originalHtml = element.innerHTML || element.value;
            if (element.contentEditable) {
                element.style.opacity = '0.7';
                element.contentEditable = 'false';
            } else {
                element.style.opacity = '0.7';
                element.disabled = true;
            }

            try {
                let updateData = {};
                
                if (fieldType === 'title') {
                    if (!newValue) {
                        alert('Title cannot be empty');
                        restoreElement(element, originalHtml);
                        return;
                    }
                    updateData.title = newValue;
                } else if (fieldType === 'date') {
                    // Handle date field - expect ISO date format
                    if (newValue) {
                        updateData.created_at = newValue;
                    }
                } else if (fieldType === 'attendees') {
                    updateData.attendees = newValue === 'None specified' ? null : newValue;
                }

                const response = await fetch(`/api/notes/${currentNote.id}`, {
                    method: 'PUT',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${accessToken}`
                    },
                    body: JSON.stringify(updateData)
                });

                if (handleTokenExpiration(response)) return;

                if (response.ok) {
                    // Update local note object
                    if (fieldType === 'title') {
                        currentNote.title = newValue;
                        loadNotes(); // Refresh sidebar
                    } else if (fieldType === 'attendees') {
                        currentNote.attendees = newValue === 'None specified' ? null : newValue;
                    } else if (fieldType === 'date') {
                        currentNote.created_at = newValue;
                    }
                    
                    // Restore element
                    restoreElement(element, newValue, true);
                    element.setAttribute('data-original', newValue === 'None specified' ? '' : newValue);
                    
                    console.log(`${fieldType} updated successfully`);
                } else {
                    const errorData = await response.json().catch(() => ({}));
                    alert('Failed to save: ' + (errorData.error || 'Unknown error'));
                    restoreElement(element, originalHtml);
                }
            } catch (error) {
                console.error('Error saving field:', error);
                alert('Error saving. Please try again.');
                restoreElement(element, originalHtml);
            }
        }

        // Helper function to restore element state
        function restoreElement(element, content, isSuccess = false) {
            if (element.contentEditable && element.contentEditable !== 'inherit') {
                element.innerHTML = isSuccess ? escapeHtml(content) : content;
                element.style.opacity = '1';
                element.contentEditable = 'true';
            } else {
                element.value = content;
                element.style.opacity = '1';
                element.disabled = false;
            }
        }

        // Open date picker modal
        function openDatePicker() {
            const currentDate = currentNote.created_at ? 
                currentNote.created_at.split('T')[0] : 
                new Date().toISOString().split('T')[0];

            const modalHtml = `
                <div class="modal-overlay" id="dateModal" onclick="closeDateModal(event)">
                    <div class="modal" onclick="event.stopPropagation()">
                        <div class="modal-header">
                            <div class="modal-title">
                                📅 Set Note Date
                                <div style="font-size: 0.75rem; font-weight: normal; color: var(--text-muted);">Choose the date for this note</div>
                            </div>
                            <button class="close-btn" onclick="closeDateModal()">&times;</button>
                        </div>
                        <div class="modal-body">
                            <div class="form-group">
                                <label class="form-label">Date</label>
                                <input type="date" class="form-input" id="dateInput" value="${currentDate}">
                            </div>
                        </div>
                        <div class="modal-footer">
                            <button class="btn-cancel" onclick="closeDateModal()">Cancel</button>
                            <button class="btn-save" onclick="saveDateChange()">Save</button>
                        </div>
                    </div>
                </div>
            `;

            document.body.insertAdjacentHTML('beforeend', modalHtml);
            
            // Show modal with animation
            requestAnimationFrame(() => {
                document.getElementById('dateModal').classList.add('show');
                document.getElementById('dateInput').focus();
            });
        }

        function closeDateModal(event) {
            if (event && event.target !== event.currentTarget) return;
            
            const modal = document.getElementById('dateModal');
            if (modal) {
                modal.classList.remove('show');
                setTimeout(() => {
                    modal.remove();
                }, 300);
            }
        }

        async function saveDateChange() {
            const dateInput = document.getElementById('dateInput');
            const newDate = dateInput.value;
            
            if (!newDate) {
                alert('Please select a date');
                return;
            }

            // Convert to ISO format
            const isoDate = new Date(newDate + 'T00:00:00').toISOString();
            
            try {
                const response = await fetch(`/api/notes/${currentNote.id}`, {
                    method: 'PUT',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${accessToken}`
                    },
                    body: JSON.stringify({ created_at: isoDate })
                });

                if (handleTokenExpiration(response)) return;

                if (response.ok) {
                    currentNote.created_at = isoDate;
                    renderNoteDisplay(); // Refresh display to show new date
                    closeDateModal();
                } else {
                    const errorData = await response.json().catch(() => ({}));
                    alert('Failed to save date: ' + (errorData.error || 'Unknown error'));
                }
            } catch (error) {
                console.error('Error saving date:', error);
                alert('Error saving date. Please try again.');
            }
        }

        // Get icon for category
        function getCategoryIcon(category) {
            const icons = {
                'General': '📝',
                'Ideas': '💡',
                'Tasks': '✅',
                'Questions': '❓',
                'Important': '⭐',
                'Code': '💻',
                'Research': '🔍',
                'Meeting': '🤝',
                'Personal': '👤'
            };
            return icons[category] || '📄';
        }
    </script>
