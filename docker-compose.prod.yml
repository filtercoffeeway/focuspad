version: '3.8'

services:
  web:
    build:
      context: .
      dockerfile: Dockerfile.prod
    container_name: focuspad_web_prod
    ports:
      - "8080:5000"
    env_file:
      - .env.prod
    depends_on:
      db:
        condition: service_healthy
    networks:
      - focuspad-prod
    restart: unless-stopped
    volumes:
      - ./logs:/app/logs
      - app_static:/app/static
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: '0.8'
        reservations:
          memory: 256M
          cpus: '0.4'

  db:
    image: postgres:15-alpine
    container_name: focuspad_db_prod
    env_file:
      - .env.prod
    environment:
      POSTGRES_DB: focuspad
      POSTGRES_USER: focuspad_user
      POSTGRES_INITDB_ARGS: "--auth-host=scram-sha-256 --auth-local=scram-sha-256"
    volumes:
      - postgres_prod_data:/var/lib/postgresql/data
      - ./scripts/init_prod.sql:/docker-entrypoint-initdb.d/init.sql
      - ./backups:/backups
    networks:
      - focuspad-prod
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U focuspad_user -d focuspad"]
      interval: 30s
      timeout: 10s
      retries: 3
    deploy:
      resources:
        limits:
          memory: 400M
          cpus: '0.6'
        reservations:
          memory: 200M
          cpus: '0.3'

  redis:
    image: redis:7-alpine
    container_name: focuspad_redis_prod
    command: >
      redis-server
      --appendonly yes
      --appendfsync everysec
      --maxmemory 64mb
      --maxmemory-policy allkeys-lru
      --save 900 1
      --save 300 10
      --save 60 10000
    volumes:
      - redis_prod_data:/data
    networks:
      - focuspad-prod
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 30s
      timeout: 10s
      retries: 3
    deploy:
      resources:
        limits:
          memory: 80M
          cpus: '0.2'
        reservations:
          memory: 40M
          cpus: '0.1'

  nginx:
    image: nginx:alpine
    container_name: focuspad_nginx_prod
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
      - app_static:/usr/share/nginx/html/static:ro
      - ./logs/nginx:/var/log/nginx
    depends_on:
      - web
    networks:
      - focuspad-prod
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "nginx", "-t"]
      interval: 30s
      timeout: 10s
      retries: 3

volumes:
  postgres_prod_data:
    driver: local
  redis_prod_data:
    driver: local
  app_static:
    driver: local

networks:
  focuspad-prod:
    driver: bridge
    driver_opts:
      com.docker.network.bridge.name: focuspad-prod 